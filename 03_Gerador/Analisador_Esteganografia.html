<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mnemosine — Analisador LSB</title><style>body{margin:0;background:#151a1d;color:#eef2f3;font:15px/1.55 system-ui}.wrap{max-width:900px;margin:auto;padding:32px}.box{background:#20292e;border:1px solid #40515a;border-radius:10px;padding:20px}button,input{padding:10px;margin:8px 0;background:#233d4d;color:white;border:1px solid #58717e;border-radius:5px}img{max-width:100%;display:block;margin-top:18px;background:#eee}a{color:#9edbf2}.warn{color:#d7be86}</style></head><body><div class="wrap"><h1>MNEMOSINE // ANALISADOR LSB</h1><p><a href="Gerador_Casos_Mnemosine.html">← voltar ao gerador</a></p><div class="box"><p>Carregue o <b>PNG original</b> de uma evidência de esteganografia. A ferramenta lê a paridade do canal vermelho (<code>R &amp; 1</code>) e reconstrói a máscara.</p><p class="warn">JPEG, captura de tela recomprimida e impressão não preservam o LSB.</p><input id="file" type="file" accept="image/png"><img id="out" alt="Resultado"></div></div><script src="js/mnemosine_visuals.js"></script><script>document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>document.getElementById('out').src=await MnemosineVisuals.stegReveal(r.result);r.readAsDataURL(f)}</script></body></html>
