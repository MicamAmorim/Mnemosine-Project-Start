<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mnemosine — Guia de Métodos</title><style>body{font-family:system-ui;background:#171b1e;color:#eee;margin:0}.wrap{max-width:900px;margin:auto;padding:32px}.card{background:#20292e;border:1px solid #40515a;border-radius:10px;padding:18px;margin:14px 0}h1,h2{color:#d9edf5}code{background:#101518;padding:2px 6px;border-radius:4px}a{color:#9dd7ef}.tag{display:inline-block;padding:3px 8px;border:1px solid #64757e;border-radius:999px;font-size:12px;margin-left:8px}.advanced{opacity:.8}</style></head><body><div class="wrap"><h1>MNEMOSINE // Guia de Métodos</h1><p>Referência rápida do investigador. O PDF completo é gerado pelo botão <b>GERAR PACK</b> no gerador e salvo como <code>01_Documentos/04_Arquivo_de_Referencia_Tecnica.pdf</code>.</p><h2>Técnicas implementadas</h2><div id="current"></div><h2>Técnicas avançadas / futuras</h2><div id="advanced"></div></div><script>const current=['Cifra de César','A1Z26','Acróstico','Amostragem periódica','Ímpares / pares','Morse visual + áudio','Quadrado de Polybius','Coordenadas em mapa','Vigenère com chave derivada','Binário','Posições primas','Sequência temporal','Ruído visual','Ocultação por canais de cor'];const advanced=['Pigpen','Scytale','Base64','Hexadecimal / ASCII','Substituição monoalfabética','Transposição colunar','Book cipher','Grade de Cardan','Esteganografia em imagem'];function draw(id,a,cls=''){document.getElementById(id).innerHTML=a.map(x=>`<div class="card ${cls}"><b>${x}</b>${cls?'<span class="tag">avançada</span>':'<span class="tag">implementada</span>'}</div>`).join('')}draw('current',current);draw('advanced',advanced,'advanced');</script></body></html>
