<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNEMOSINE // ARQUIVO ZERO — Gerador v2.2</title>
<style>
:root{--navy:#233d4d;--paper:#eee9dc;--ink:#222;--line:#777;--gold:#b78b35;--red:#a73732}
*{box-sizing:border-box}body{margin:0;background:#151a1d;color:#eef2f3;font-family:system-ui,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:360px 1fr;min-height:100vh}.controls{padding:20px;background:#0f1518;border-right:1px solid #34444c;height:100vh;overflow:auto;position:sticky;top:0}.stage{padding:24px}.controls h1{font-size:20px;margin:0}.muted{color:#9cafb8;font-size:12px}.group{border-top:1px solid #314048;margin-top:16px;padding-top:14px}.group h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em}.row{display:flex;gap:8px}.row>*{flex:1}input,button{width:100%;padding:9px;border-radius:5px;border:1px solid #44545c;background:#182126;color:white}button{cursor:pointer;background:#254858;font-weight:700}button.gold{background:#765d2e}button.secondary{background:#242d31}.check{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;font-size:13px;margin:6px 0}.check input{width:auto}.badge{font-size:10px;border:1px solid #64757e;border-radius:999px;padding:2px 6px;color:#adc4ce}.advanced{opacity:.65}.status{font:12px monospace;color:#a9cbd6;min-height:18px}.cases{max-height:160px;overflow:auto;border:1px solid #34444c;padding:6px;border-radius:5px}.caseitem{font:11px monospace;padding:5px;border-bottom:1px solid #29353b}.paper{width:210mm;min-height:297mm;margin:0 auto 20px;background:var(--paper);color:var(--ink);padding:16mm;box-shadow:0 4px 22px #0008;background-image:radial-gradient(#aaa5 1px,transparent 1px);background-size:11px 11px;page-break-after:always}.paper h1{font-family:Georgia,serif;font-size:30px;margin:8px 0}.strip{background:var(--navy);color:white;padding:9px 12px;font:700 13px monospace}.section{border-bottom:1px solid #777;margin-top:20px;padding-bottom:4px;font:700 11px monospace}.meta{border-collapse:collapse;width:100%;font:10px monospace}.meta td{border:1px solid #777;padding:6px}.evidence{border:1px solid #777;min-height:120px;margin-top:8px;padding:16px;display:grid;place-items:center;overflow:hidden}.visual{max-width:100%;width:100%;height:auto}.cipher{font:700 22px/1.6 monospace;word-break:break-word;text-align:center}.morsebox{background:#07161d;border:2px solid #41606a;width:100%;padding:14px}.morse-svg{width:100%;height:auto;display:block}.audio-actions{display:flex;gap:8px;margin-top:8px}.audio-actions button{width:auto;padding:7px 12px}.answer{height:36px;border:1px solid #777;margin-top:8px}.warning{background:#76591f;color:#fff8dc;border-left:5px solid #f2c760;padding:12px;font:700 12px/1.4 monospace}.recon{width:297mm;min-height:210mm;padding:10mm 14mm}.slots{display:grid;grid-template-columns:repeat(3,63mm);grid-template-rows:repeat(2,88mm);gap:4mm 7mm;justify-content:center}.slot{border:1px solid #666;position:relative}.slot b{display:block;background:var(--navy);color:#fff;padding:5px;font:700 10px monospace}.slot span{position:absolute;top:47%;left:0;right:0;text-align:center;font:9px monospace;color:#777}.mediator{border:3px solid #a73732}.techname{font:11px monospace;color:#666}.toolbar{max-width:1050px;margin:0 auto 15px;display:flex;gap:8px}.toolbar button{width:auto}.help{color:#a9d8ec;text-decoration:none;font-weight:800}@media(max-width:1000px){.app{display:block}.controls{position:relative;height:auto}.paper{transform-origin:top left;max-width:100%}}@media print{body{background:#fff}.controls,.toolbar,.audio-actions{display:none!important}.stage{padding:0}.paper{box-shadow:none;margin:0;page-break-after:always;width:210mm;min-height:297mm}.paper.recon{width:297mm;min-height:210mm;page:landscape}.evidence{overflow:visible}.morse-svg{max-width:100%}@page{size:A4 portrait;margin:0}@page landscape{size:A4 landscape;margin:0}.recon{page:landscape}}
</style>
</head><body>
<div class="app"><aside class="controls"><h1>MNEMOSINE // ARQUIVO ZERO</h1><div class="muted">Gerador de Casos v2.2 — fonte única dos documentos</div>
<div class="group"><h2>Projeto</h2><button id="pick">Selecionar pasta do projeto</button><button id="pack" class="gold" style="margin-top:7px">GERAR PACK</button><div id="status" class="status"></div><button id="refresh" class="secondary">Atualizar lista de casos</button><div id="cases" class="cases"></div></div>
<div class="group"><h2>Novo caso</h2><label class="muted">Seed</label><div class="row"><input id="seed"><button id="random" class="secondary">Aleatória</button></div></div>
<div class="group"><h2>Técnicas implementadas</h2><div id="impl"></div></div>
<div class="group"><h2>Técnicas avançadas</h2><div class="muted">Roadmap — listadas para planejamento, ainda não geradas.</div><div id="adv"></div></div>
<div class="group"><button id="generate">Gerar caso</button><button id="savepdf" class="gold" style="margin-top:7px">Salvar PDF em 02_Casos</button><button id="exporthtml" class="secondary" style="margin-top:7px">Exportar HTML interativo</button><button onclick="window.print()" class="secondary" style="margin-top:7px">Imprimir / Salvar PDF pelo navegador</button></div>
</aside><main class="stage"><div class="toolbar"><button id="topSave">Salvar caso em PDF</button><a class="help" href="Metodos_Mnemosine.html" target="_blank">Guia de métodos ↗</a></div><div id="preview"></div></main></div>
<script src="js/mnemosine_fs.js"></script><script src="js/mnemosine_pdf.js"></script><script src="js/mnemosine_data.js"></script><script src="js/mnemosine_visuals.js"></script><script src="js/mnemosine_render.js"></script>
<script>
const $=s=>document.querySelector(s), D=MnemosineData, R=MnemosineRender;
let current=null;
function initTech(){for(const t of D.implemented){const d=document.createElement('label');d.className='check';d.innerHTML=`<input type="checkbox" data-tech="${t.id}" checked><span>${t.name}</span><a class="help" target="_blank" href="Metodos_Mnemosine.html#${t.id}">?</a>`;$('#impl').appendChild(d)}for(const t of D.advanced){const d=document.createElement('label');d.className='check advanced';d.innerHTML=`<input type="checkbox" disabled><span>${t.name}</span><span class="badge">avançada</span>`;$('#adv').appendChild(d)}}
function selected(){return [...document.querySelectorAll('[data-tech]:checked')].map(x=>x.dataset.tech)}
function caseBuild(seed){const r=D.rngFrom(seed),sol={};for(const c of D.categories)sol[c]=D.choose(D.cards[c],r);const sel=selected();if(sel.length<3)throw new Error('Marque ao menos três técnicas implementadas.');const used=[];const tech=[];for(const cat of D.categories){let pool=R.compatibleTechniques(cat,sel).filter(x=>!used.includes(x));if(!pool.length)pool=R.compatibleTechniques(cat,sel);let t=D.choose(pool,r);if(cat==='local'&&sel.includes('coords')&&r()<.45)t='coords';if(cat==='horario'&&sel.includes('time')&&r()<.55)t='time';used.push(t);tech.push({category:cat,technique:t})}return {seed:String(seed),solution:sol,techniques:tech,verification:D.verification(sol)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function docHead(id,p='1'){return `<div style="display:grid;grid-template-columns:72px 1fr 155px;gap:12px;border-bottom:1px solid #444;padding-bottom:8px"><img src="../04_Assets/dicc_logo_clean.png" style="width:64px"><div style="font:10px/1.6 monospace">ESTADO DA REPÚBLICA FEDERATIVA DO BRASIL<br>SECRETARIA DE SEGURANÇA PÚBLICA<br><b>DEPARTAMENTO DE INVESTIGAÇÕES CRIMINAIS E<br>COMBATE AO CRIME ORGANIZADO</b><br>D.I.C.C. — UNIDADE DE ANÁLISE DE CASOS ESPECIAIS</div><div style="border:1px solid #555;padding:8px;font:10px monospace">NÚMERO DO CASO:<br><b>${esc(id)}</b><br><br>PÁGINA: ${p}</div></div><h1>CASO MNEMOSINE</h1>`}
function morseSvg(code){const toks=code.split(/\s+/), lines=[];let line=[],len=0;for(const t of toks){const n=t==='|'?12:[...t].reduce((a,ch)=>a+(ch==='.'?7:14),0)+8;if(len+n>130){lines.push(line);line=[];len=0}line.push(t);len+=n}if(line.length)lines.push(line);const H=lines.length*36+15;let svg=`<svg class="morse-svg" viewBox="0 0 900 ${H}">`;lines.forEach((arr,ri)=>{let x=20,y=24+ri*36;for(const t of arr){if(t==='|'){x+=32;continue}for(const ch of t){const w=ch==='.'?16:42;svg+=`<line x1="${x}" y1="${y}" x2="${x+w}" y2="${y}" stroke="#81d4e5" stroke-width="7" stroke-linecap="round"/>`;x+=w+10}x+=20}});return svg+'</svg>'}
function evidenceHtml(m){if(m.image)return `<img class="visual" src="${m.image}"><div class="techname">${m.type==='color'?'Registro multiespectral; compare canais de cor.':'Registro visual degradado.'}</div>`;if(m.type==='morse')return `<div class="morsebox">${morseSvg(m.text)}</div><div class="audio-actions"><button onclick="playMorse('${esc(m.text)}')">▶ Ouvir Morse</button><button onclick="downloadMorse('${esc(m.text)}')">Baixar WAV</button></div>`;if(m.type==='coords'){return `<div><table class="meta">${[0,1,2].map(r=>`<tr>${[0,1,2].map(c=>{const q=m.cells[r*3+c];return `<td><b>${q.k}</b><br>${esc(q.value)}</td>`}).join('')}</tr>`).join('')}</table><p class="cipher">COORDENADA: ${m.code}</p></div>`}return `<div class="cipher">${esc(m.text).replace(/\n/g,'<br>')}</div>`}
function render(){if(!current)return;const id='DICC-AZ-'+current.seed.slice(-8);let h=`<section class="paper">${docHead(id,1)}<div class="strip">DOSSÊ OPERACIONAL — CASO GERADO</div><div class="section">MISSÃO</div><p>Reconstrua seis elementos: pessoa, local, instrumento, motivo, horário e rota. Cada resposta corresponde a uma carta física.</p><div class="warning">Se uma evidência apontar para um FRAGMENTO K, resolva primeiro a página intermediária. A palavra-passe do próximo enigma nunca é fornecida diretamente.</div><div class="section">PROTOCOLO</div><ol><li>Resolva as páginas na ordem.</li><li>Selecione a carta correspondente.</li><li>Monte o Quadro de Reconstrução.</li><li>Registre a palavra de verificação.</li></ol></section>`;let p=2;for(const it of current.techniques){const ans=current.solution[it.category].name,m=R.evidenceModel(ans,it.technique,current.seed+'|'+it.category);if(m.type==='vigenere')h+=`<section class="paper">${docHead(id+'-K',p++)}<div class="strip">FRAGMENTO K — CHAVE INTERMEDIÁRIA</div><div class="section">CONTEÚDO RECUPERADO</div><div class="evidence"><div class="cipher">${m.keyFragment}</div></div><p>Resolva este fragmento; o resultado é a palavra-passe da próxima evidência.</p></section>`;h+=`<section class="paper">${docHead(id+'-'+String(p).padStart(2,'0'),p++)}<div class="strip">ANEXO — ${esc(m.meta).toUpperCase()}</div><div class="section">IDENTIFICAÇÃO DA EVIDÊNCIA</div><table class="meta"><tr><td>CATEGORIA</td><td>${D.labels[it.category]}</td></tr><tr><td>INTEGRIDADE</td><td>Preservada</td></tr></table><div class="section">CONTEÚDO RECUPERADO</div><div class="evidence">${evidenceHtml(m)}</div><div class="section">CONCLUSÃO DA EQUIPE</div><div class="answer"></div></section>`}h+=`<section class="paper recon"><h1>QUADRO DE RECONSTRUÇÃO</h1><p class="muted" style="color:#666">POSICIONE FISICAMENTE AS SEIS CARTAS NOS CAMPOS ABAIXO</p><div style="text-align:right;font:700 10px monospace">PALAVRA DE VERIFICAÇÃO: ___________________________</div><div class="slots">${D.categories.map((c,i)=>`<div class="slot"><b>${i+1}. ${D.labels[c]}</b><span>POSICIONE A CARTA AQUI</span></div>`).join('')}</div></section>`;h+=`<section class="paper mediator">${docHead(id+'-MED','FINAL')}<div class="strip">GABARITO DO MEDIADOR — NÃO ENTREGAR DURANTE A RESOLUÇÃO</div>${D.categories.map((c,i)=>{const t=D.implemented.find(x=>x.id===current.techniques[i].technique)?.name||current.techniques[i].technique;return `<p><b>${i+1}. ${D.labels[c]}</b> — ${esc(current.solution[c].name)} <span class="techname">(${esc(t)})</span></p>`}).join('')}<div class="strip">PALAVRA DE VERIFICAÇÃO: ${current.verification}</div></section>`;$('#preview').innerHTML=h}
function randomSeed(){return String(Date.now()).slice(-10)+Math.floor(Math.random()*999)}
async function chooseProject(){await MnemosineFS.chooseRoot();await MnemosineFS.ensureStructure();$('#status').textContent='Pasta selecionada.';refreshCases()}
async function pack(){try{$('#status').textContent='Gerando documentos...';const names=await R.generatePack();$('#status').textContent='PACK gerado: '+names.length+' PDFs em 01_Documentos.'}catch(e){console.error(e);$('#status').textContent='Erro: '+e.message}}
async function savePdf(){if(!current)return alert('Gere um caso primeiro.');try{await MnemosineFS.ensureStructure();const blob=await R.casePdf(current);const safe=current.seed.replace(/[^A-Za-z0-9_-]/g,'_');const name=`DICC-AZ-${safe}.pdf`;await MnemosineFS.write('02_Casos/'+name,blob);await MnemosineFS.write('02_Casos/'+name.replace(/\.pdf$/,'.json'),new Blob([JSON.stringify(current,null,2)],{type:'application/json'}));$('#status').textContent='Caso salvo em 02_Casos/'+name;refreshCases()}catch(e){console.error(e);$('#status').textContent='Erro ao salvar: '+e.message}}
async function refreshCases(){try{const a=await MnemosineFS.listCases();$('#cases').innerHTML=a.length?a.map(x=>`<div class="caseitem">${esc(x.name)}<br>${(x.size/1024/1024).toFixed(1)} MB</div>`).join(''):'<div class="muted">Nenhum caso salvo.</div>'}catch(e){$('#cases').innerHTML='<div class="muted">Selecione a pasta do projeto.</div>'}}
function toneEvents(code){let t=0,out=[];for(const tok of code.split(/\s+/)){if(tok==='|'){t+=.55;continue}for(const ch of tok){const d=ch==='.'?.09:.27;out.push([t,d]);t+=d+.09}t+=.18}return [out,t+.15]}
function playMorse(code){const A=new (window.AudioContext||window.webkitAudioContext)(),[ev,total]=toneEvents(code);for(const [t,d] of ev){const o=A.createOscillator(),g=A.createGain();o.frequency.value=650;g.gain.value=.16;o.connect(g).connect(A.destination);o.start(A.currentTime+t);o.stop(A.currentTime+t+d)}setTimeout(()=>A.close(),(total+1)*1000)}
function wavBlob(code){const sr=44100,[ev,total]=toneEvents(code),n=Math.ceil(total*sr),data=new Int16Array(n);for(const [t,d] of ev){for(let i=Math.floor(t*sr);i<Math.min(n,Math.floor((t+d)*sr));i++)data[i]=Math.sin(2*Math.PI*650*i/sr)*8000}const b=new ArrayBuffer(44+n*2),v=new DataView(b);const s=(o,z)=>[...z].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++)v.setInt16(44+i*2,data[i],true);return new Blob([b],{type:'audio/wav'})}
function downloadMorse(code){const u=URL.createObjectURL(wavBlob(code)),a=document.createElement('a');a.href=u;a.download='morse.wav';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function exportHtml(){if(!current)return alert('Gere um caso primeiro.');let body=$('#preview').innerHTML;try{const logo=await MnemosineFS.assetDataURL('dicc_logo_clean.png');body=body.replaceAll('../04_Assets/dicc_logo_clean.png',logo)}catch(e){}const src='<!doctype html><meta charset="utf-8"><title>Mnemosine '+esc(current.seed)+'</title><style>'+document.querySelector('style').textContent+'body{background:#222}.controls,.toolbar{display:none}.stage{padding:20px}</style><main class="stage">'+body+'</main><script>'+toneEvents.toString()+';'+playMorse.toString()+';'+wavBlob.toString()+';'+downloadMorse.toString()+'<\/script>';const blob=new Blob([src],{type:'text/html'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Mnemosine_'+current.seed+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
initTech();$('#seed').value=randomSeed();$('#random').onclick=()=>$('#seed').value=randomSeed();$('#generate').onclick=()=>{try{current=caseBuild($('#seed').value.trim()||randomSeed());render()}catch(e){alert(e.message)}};$('#pick').onclick=chooseProject;$('#pack').onclick=pack;$('#savepdf').onclick=savePdf;$('#topSave').onclick=savePdf;$('#refresh').onclick=refreshCases;$('#exporthtml').onclick=exportHtml;MnemosineFS.getRoot(false).then(h=>{if(h){$('#status').textContent='Pasta lembrada; autorize se solicitado.';refreshCases()}});current=caseBuild($('#seed').value);render();
</script></body></html>
